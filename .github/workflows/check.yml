name: PR Check - Lint, Test, Build

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Check formatting and lint
        run: |
          bun run fmt
          bun run lint

      - name: Test
        run: |
          bun run test

      - name: Build
        run: |
          bun run build

      - name: Install client-only example dependencies
        working-directory: examples/client-only
        run: bun install --frozen-lockfile

      - name: Check client-only example
        working-directory: examples/client-only
        run: bun run check

      - name: Install server-only example dependencies
        working-directory: examples/server-only
        run: bun install --frozen-lockfile

      - name: Check server-only example
        working-directory: examples/server-only
        run: bun run check

      - name: Install interactive example dependencies
        working-directory: examples/interactive
        run: bun install --frozen-lockfile

      - name: Check interactive example
        working-directory: examples/interactive
        run: bun run check

      - name: Install monorepo example dependencies
        working-directory: examples/monorepo
        run: bun install --frozen-lockfile

      - name: Check monorepo example
        working-directory: examples/monorepo
        run: bun run check

      - name: Verify example files are unchanged
        run: git diff --exit-code -- examples
